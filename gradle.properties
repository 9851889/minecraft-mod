# ===== Gradle =====
# 给 Gradle 更多内存，否则反编译 Minecraft 时容易内存不足
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Gradle 本身跑在 JDK 25 上 —— Fabric Loom 1.19 的字节码要求 JVM 25+
# org.gradle.java.home 指向本机 Gradle 用的 JDK（各人不同，不入库）

# 告诉 Gradle 去哪里找编译用的 JDK：
# 模组按 Java 17 编译并运行（Minecraft 1.20.4 的要求）
# org.gradle.java.installations.paths 指向本机编译用的 JDK（各人不同，不入库）

# ===== Fabric 依赖版本 =====
# 这几个值来自 https://fabricmc.net/develop ，与官方 1.20.4 模板一致
minecraft_version=1.20.4
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.97.3+1.20.4

# ===== 模组信息 =====
version=1.0.0
group=com.example
mod_id=starbeast
mod_name=星辉兽
